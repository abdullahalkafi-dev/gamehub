# API (Express on 127.0.0.1:4110). Installed as /etc/nginx/sites-available/api.gamehub.joura.info
server {
    listen 80;
    listen [::]:80;
    server_name api.gamehub.joura.info;
    return 301 https://api.gamehub.joura.info$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.gamehub.joura.info;

    ssl_certificate /etc/letsencrypt/live/gamehub.joura.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gamehub.joura.info/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:4110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
