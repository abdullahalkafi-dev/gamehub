# Web (Next.js on 127.0.0.1:3110). Installed as /etc/nginx/sites-available/gamehub.joura.info
server {
    listen 80;
    listen [::]:80;
    server_name gamehub.joura.info;
    return 301 https://gamehub.joura.info$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gamehub.joura.info;

    ssl_certificate /etc/letsencrypt/live/gamehub.joura.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gamehub.joura.info/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
